{% extends 'base.html' %}
{% block content %}
<div class="py-5 text-center">
    <h2>Подтвердите удаление</h2>
    <p class="lead">Вы действительно хотите удалить рассылку:<br><strong>"{{ object }}"</strong>?</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-outline-secondary btn-lg px-4">Отмена</a>
                <button type="submit" class="btn btn-danger btn-lg px-4">Удалить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
