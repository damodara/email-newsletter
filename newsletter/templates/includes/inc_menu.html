<div class="col-md-3 mb-2 mb-md-0">
	<a href="{% url 'newsletter:dashboard' %}" class="d-inline-flex link-body-emphasis text-decoration-none">
		<svg class="bi" width="40" height="32" role="img" aria-label="Bootstrap">
			<use xlink:href="#bootstrap"/>
		</svg>
	</a>
</div>

<ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
	<li><a href="{% url 'newsletter:dashboard' %}" class="nav-link px-2">Главная</a></li>
	{% if user.is_authenticated %}
	<li><a href="{% url 'newsletter:subscriber_list' %}" class="nav-link px-2">Получатели</a></li>
	<li><a href="{% url 'newsletter:message_list' %}" class="nav-link px-2">Сообщения</a></li>
	<li><a href="{% url 'newsletter:mailing_list' %}" class="nav-link px-2">Рассылки</a></li>
	<li><a href="{% url 'newsletter:statistics' %}" class="nav-link px-2">Статистика</a></li>
	{% if user_is_manager %}
	<li><a href="{% url 'users:user_list' %}" class="nav-link px-2">Пользователи</a></li>
	{% endif %}
	{% endif %}
</ul>

<div class="col-md-3 text-end">
	{% if user.is_authenticated %}
	<a href="{% url 'users:profile' %}" class="nav-link px-2 d-inline">{{ user.email }}</a>
	<a href="{% url 'users:logout' %}" class="btn btn-outline-primary">Выход</a>
	{% else %}
	<a href="{% url 'users:login' %}" class="btn btn-outline-primary me-2">Вход</a>
	<a href="{% url 'users:register' %}" class="btn btn-bd-primary">Регистрация</a>
	{% endif %}
</div>
