{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>Главная</title>
    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/checkout/">
    <script src="{% static 'js/color-modes.js' %}"></script>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <meta name="theme-color" content="#712cf9">
    <link href="{% static 'css/checkout.css' %}" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
            padding-top: 3rem;
            padding-bottom: 3rem;
            margin-top: auto;
            background-color: #f8f9fa;
            border-top: 1px solid #e5e5e5;
        }

        /* Эффекты при наведении на пункты меню */
        .nav-link {
            transition: all 0.3s ease;
            color: #6c757d !important;
            position: relative;
        }

        .nav-link:hover {
            color: #712cf9 !important; /* Сиреневый цвет */
            transform: translateY(-2px);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 50%;
            background-color: #712cf9; /* Сиреневый цвет */
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 70%;
        }

        /* Анимация кнопок */
        .btn-bd-primary {
            --bd-violet-bg: #712cf9; /* Сиреневый цвет */
            --bd-violet-rgb: 112.520718, 44.062154, 249.437846;
            --bs-btn-font-weight: 600;
            --bs-btn-color: var(--bs-white);
            --bs-btn-bg: var(--bd-violet-bg);
            --bs-btn-border-color: var(--bd-violet-bg);
            --bs-btn-hover-color: var(--bs-white);
            --bs-btn-hover-bg: #6528e0;
            --bs-btn-hover-border-color: #6528e0;
            --bs-btn-focus-shadow-rgb: var(--bd-violet-rgb);
            --bs-btn-active-color: var(--bs-btn-hover-color);
            --bs-btn-active-bg: #5a23c8;
            --bs-btn-active-border-color: #5a23c8
        }

        .btn-outline-primary {
            --bs-btn-color: #712cf9;
            --bs-btn-border-color: #712cf9;
            --bs-btn-hover-color: var(--bs-white);
            --bs-btn-hover-bg: #712cf9;
            --bs-btn-hover-border-color: #712cf9;
            --bs-btn-focus-shadow-rgb: 113,44,249;
            --bs-btn-active-color: var(--bs-white);
            --bs-btn-active-bg: #712cf9;
            --bs-btn-active-border-color: #712cf9;
            transition: all 0.3s ease;
        }

        .btn-bd-primary:hover,
        .btn-outline-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* Остальные стили остаются без изменений */
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem
            }
        }

        .b-example-divider {
            width: 100%;
            height: 3rem;
            background-color: #0000001a;
            border: solid rgba(0, 0, 0, .15);
            border-width: 1px 0;
            box-shadow: inset 0 .5em 1.5em #0000001a, inset 0 .125em .5em #00000026
        }

        .b-example-vr {
            flex-shrink: 0;
            width: 1.5rem;
            height: 100vh
        }

        .bi {
            vertical-align: -.125em;
            fill: currentColor
        }

        .nav-scroller {
            position: relative;
            z-index: 2;
            height: 2.75rem;
            overflow-y: hidden
        }

        .nav-scroller .nav {
            display: flex;
            flex-wrap: nowrap;
            padding-bottom: 1rem;
            margin-top: -1px;
            overflow-x: auto;
            text-align: center;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch
        }

        .bd-mode-toggle {
            z-index: 1500
        }

        .bd-mode-toggle .bi {
            width: 1em;
            height: 1em
        }

        .bd-mode-toggle .dropdown-menu .active .bi {
            display: block !important
        }
    </style>
</head>
<body class="bg-body-tertiary">
    <header class="container d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
        {% include 'includes/inc_menu.html' %}
    </header>

    <main class="flex-grow-1">
        <div class="container py-5">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="text-body-secondary text-center text-small">
        <div class="container">
            <p class="mb-1">&copy; 2026</p>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}" class="astro-vvvwv3sm"></script>
    <script src="{% static 'js/checkout.js' %}" class="astro-vvvwv3sm"></script>
</body>
</html>
