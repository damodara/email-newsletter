{% extends 'base.html' %}
{% block content %}
<div class="py-5 text-center">
    <h2>Подтвердите удаление</h2>
    <p>Вы действительно хотите удалить письмо: <strong>"{{ object.subject }}"</strong>?</p>
</div>
<div class="row justify-content-center">
    <div class="col-md-6">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'newsletter:message_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
